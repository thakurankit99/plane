# Koyeb Deployment Configuration
# This file helps configure your Plane deployment on Koyeb

services:
  - name: plane
    type: web
    instance_type: free
    regions:
      - fra  # Frankfurt - change to your preferred region
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
        port: 3000
    
    # Health check configuration
    health_checks:
      - http:
          port: 3000
          path: /
          # Longer grace period for initial migrations
          grace_period: 300  # 5 minutes for first deployment
          interval: 30
          timeout: 10
          restart_limit: 5
    
    # Environment variables (set these in Koyeb dashboard)
    env:
      - DEBUG=0
      - DOCKERIZED=1
      # Add all other env vars from .env file in Koyeb dashboard
    
    # Scaling configuration
    scaling:
      min: 1
      max: 1
    
    # Resource limits for free tier
    resources:
      memory: 512  # MB
      cpu: 0.1     # vCPU
