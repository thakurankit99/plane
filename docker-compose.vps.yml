version: "3.8"

services:
  plane-unified:
    image: ankitosm/plane-unified:latest
    container_name: plane-unified
    restart: unless-stopped
    network_mode: "bridge"
    ports:
      - "8888:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
